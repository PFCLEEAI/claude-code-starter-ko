<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 빌더 기초 레퍼런스 — Claude Code부터 GitHub까지</title>
<meta name="description" content="Claude Code를 처음 쓰는 부트캠프 수강생을 위한 한 페이지 레퍼런스. 기초 개념, 프롬프트, 명령어, 에이전트, GitHub와 배포까지 검색하면서 읽어요.">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="AI 빌더 기초 레퍼런스 — Claude Code부터 GitHub까지">
<meta property="og:description" content="Claude Code를 처음 쓰는 사람을 위한 한 페이지 레퍼런스. 검색되는 명령어 표와 용어집이 들어 있어요.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<script>
(function () {
  var r = document.documentElement;
  r.classList.add('js');
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') r.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
</head>
<body id="top">
<a class="skip-link" href="#main">본문으로 건너뛰기</a>

<header class="site-header" id="site-header">
  <div class="header-inner">
    <button type="button" id="toc-toggle" class="icon-btn toc-toggle" aria-controls="toc" aria-expanded="false" aria-label="목차 열기">
      <span aria-hidden="true">☰</span><span class="btn-text">목차</span>
    </button>
    <a class="brand" href="#top">AI 빌더 기초 레퍼런스</a>
    <div class="search" role="search">
      <input id="search-input" type="search" placeholder="검색  ( / 키 )" autocomplete="off" spellcheck="false"
             aria-label="페이지 검색" aria-controls="search-results" aria-autocomplete="list" aria-expanded="false">
      <ul id="search-results" class="search-results" role="listbox" aria-label="검색 결과" hidden></ul>
    </div>
    <button type="button" id="theme-toggle" class="icon-btn" aria-label="테마 바꾸기" title="라이트 / 다크 전환"></button>
  </div>
  <div class="progress" aria-hidden="true"><div id="progress-bar" class="progress-bar"></div></div>
</header>
<div id="toc-backdrop" class="toc-backdrop" hidden></div>

<div class="layout">
  <nav id="toc" class="toc" aria-label="목차">
    <p class="toc-title">목차</p>
{{TOC}}
  </nav>

  <main id="main" class="content">
    <noscript><p class="callout warn">⚠️ JavaScript가 꺼져 있으면 검색, 명령어 표, 용어집, 다이어그램이 보이지 않아요.</p></noscript>
{{SECTIONS}}
  </main>
</div>

<footer class="site-footer">
  <p>보충 학습 자료 · 공식 문서와 CC101 링크 포함 · 마지막 업데이트 {{BUILD_DATE}}</p>
</footer>

{{DATA}}
<script id="mermaid-js" async src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script src="app.js" defer></script>
</body>
</html>
